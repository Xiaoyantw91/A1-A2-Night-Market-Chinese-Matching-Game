<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中英單詞配對遊戲</title>
    <style>
        :root {
            --success: #00e676;
            --error: #ff1744;
            --text-shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 15px;
            background-color: #f4f7f6;
            background-image: radial-gradient(#d1d8e0 2px, transparent 2px);
            background-size: 20px 20px;
            color: #333;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 0;
            z-index: 100;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            color: #2c3e50;
            font-weight: 900;
        }

        .progress {
            font-size: 1.2rem;
            font-weight: 800;
            color: #636e72;
        }
        
        #score {
            color: #ff4757;
            font-size: 1.4rem;
        }

        .zone-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin: 20px 0 10px 0;
            color: #2d3436;
            text-align: left;
            padding-left: 5px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* 網格佈局：手機改為 2 欄較適合 10 個項目，平板/桌機維持 5 欄 */
        .grid-zone {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        @media (min-width: 768px) {
            .grid-zone {
                grid-template-columns: repeat(5, 1fr);
                gap: 15px;
            }
        }

        .card {
            border-radius: 12px;
            padding: 10px 5px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            word-break: break-word;
            color: #ffffff;
            text-shadow: 1px 1.5px 2px var(--text-shadow);
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(0,0,0,0.15);
        }
        
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
        }

        .card.selected {
            outline: 4px solid #ffffff;
            outline-offset: -2px;
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.9), 0 5px 0 rgba(0,0,0,0.15) !important;
            transform: scale(1.05) translateY(-2px);
            z-index: 10;
        }

        @keyframes glowGreen {
            0% { filter: hue-rotate(0deg); outline: 4px solid var(--success); box-shadow: 0 0 10px var(--success); }
            100% { background: var(--success) !important; outline: 4px solid #fff; box-shadow: 0 0 30px var(--success); }
        }

        .card.correct {
            animation: glowGreen 0.6s ease-in-out forwards !important;
            pointer-events: none;
        }

        .card.matched {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-2deg); outline: 4px solid var(--error); }
            75% { transform: translateX(6px) rotate(2deg); outline: 4px solid var(--error); background: var(--error) !important;}
        }

        .card.incorrect {
            animation: shakeRed 0.4s ease-in-out !important;
            pointer-events: none;
            z-index: 10;
        }

        .zh-card {
            font-size: 1.8rem;
            cursor: grab;
        }
        .zh-card:active {
            cursor: grabbing;
        }
        .en-card {
            font-size: 1.1rem;
            line-height: 1.2;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>✨ 中英單詞配對 ✨</h1>
        <div class="progress">進度: <span id="score">0</span> / 10</div>
    </div>

    <!-- 中文區 -->
    <div class="zone-title">👇 中文字卡區</div>
    <div id="chinese-zone" class="grid-zone"></div>

    <!-- 英文區 -->
    <div class="zone-title">🎯 英文目標區</div>
    <div id="english-zone" class="grid-zone"></div>

    <script>
        // 保留 10 組單字
        const vocabulary = [
            { id: 1, zh: '我', en: 'I / Me' },
            { id: 2, zh: '吃', en: 'Eat' },
            { id: 3, zh: '喝', en: 'Drink' },
            { id: 4, zh: '買', en: 'Buy' },
            { id: 5, zh: '錢', en: 'Money' },
            { id: 6, zh: '要', en: 'Want' },
            { id: 7, zh: '不', en: 'Not / No' },
            { id: 8, zh: '給', en: 'Give' },
            { id: 9, zh: '茶', en: 'Tea' },
            { id: 10, zh: '飯', en: 'Rice/Meal' }
        ];

        const gradients = [
            'linear-gradient(135deg, #FF6B6B 0%, #FF8E53 100%)',
            'linear-gradient(135deg, #4FACFE 0%, #00F2FE 100%)',
            'linear-gradient(135deg, #43E97B 0%, #38F9D7 100%)',
            'linear-gradient(135deg, #FA709A 0%, #FEE140 100%)',
            'linear-gradient(135deg, #C471F5 0%, #FA71CD 100%)',
            'linear-gradient(135deg, #F83600 0%, #F9D423 100%)',
            'linear-gradient(135deg, #16A085 0%, #F4D03F 100%)',
            'linear-gradient(135deg, #B224EF 0%, #7579FF 100%)',
            'linear-gradient(135deg, #00C6FF 0%, #0072FF 100%)',
            'linear-gradient(135deg, #FF0844 0%, #FFB199 100%)',
            'linear-gradient(135deg, #11998E 0%, #38EF7D 100%)',
            'linear-gradient(135deg, #9D50BB 0%, #6E48AA 100%)',
            'linear-gradient(135deg, #F093FB 0%, #F5576C 100%)',
            'linear-gradient(135deg, #F2994A 0%, #F2C94C 100%)',
            'linear-gradient(135deg, #4CB8C4 0%, #3CD3AD 100%)'
        ];

        let activeZh = null;
        let activeEn = null;
        let currentScore = 0;

        function shuffle(array) {
            let currentIndex = array.length, randomIndex;
            while (currentIndex !== 0) {
                randomIndex = Math.floor(Math.random() * currentIndex);
                currentIndex--;
                [array[currentIndex], array[randomIndex]] = [array[randomIndex], array[currentIndex]];
            }
            return array;
        }

        function initGame() {
            const zhZone = document.getElementById('chinese-zone');
            const enZone = document.getElementById('english-zone');
            
            const shuffledZh = shuffle([...vocabulary]);
            const shuffledEn = shuffle([...vocabulary]);
            
            // 從色彩庫中隨機挑選 10 個顏色打亂使用
            const zhColors = shuffle([...gradients]).slice(0, 10);
            const enColors = shuffle([...gradients]).slice(0, 10);

            shuffledZh.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card zh-card';
                card.textContent = item.zh;
                card.dataset.id = item.id;
                card.style.backgroundImage = zhColors[index];
                card.draggable = true;

                card.addEventListener('click', () => handleCardClick(card, 'zh'));
                
                card.addEventListener('dragstart', (e) => {
                    e.dataTransfer.setData('text/plain', item.id);
                    handleCardClick(card, 'zh');
                });

                zhZone.appendChild(card);
            });

            shuffledEn.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = 'card en-card';
                card.textContent = item.en;
                card.dataset.id = item.id;
                card.style.backgroundImage = enColors[index];

                card.addEventListener('click', () => handleCardClick(card, 'en'));

                card.addEventListener('dragover', (e) => e.preventDefault());
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    const draggedId = e.dataTransfer.getData('text/plain');
                    const draggedCard = document.querySelector(`.zh-card[data-id="${draggedId}"]:not(.matched)`);
                    if (draggedCard) {
                        checkMatch(draggedCard, card);
                    }
                });

                enZone.appendChild(card);
            });
        }

        function handleCardClick(card, type) {
            if (card.classList.contains('matched') || card.classList.contains('correct')) return;

            if (type === 'zh') {
                if (activeZh) activeZh.classList.remove('selected');
                activeZh = card;
                activeZh.classList.add('selected');
            } else {
                if (activeEn) activeEn.classList.remove('selected');
                activeEn = card;
                activeEn.classList.add('selected');
            }

            if (activeZh && activeEn) {
                checkMatch(activeZh, activeEn);
            }
        }

        function checkMatch(zhCard, enCard) {
            const isMatch = zhCard.dataset.id === enCard.dataset.id;

            zhCard.classList.remove('selected');
            enCard.classList.remove('selected');
            activeZh = null;
            activeEn = null;

            if (isMatch) {
                zhCard.classList.add('correct');
                enCard.classList.add('correct');
                
                currentScore++;
                document.getElementById('score').textContent = currentScore;

                setTimeout(() => {
                    zhCard.classList.add('matched');
                    enCard.classList.add('matched');
                    
                    // 過關條件更新為 10
                    if (currentScore === 10) {
                        setTimeout(() => alert('🎉 恭喜！您已成功完成所有配對！'), 400);
                    }
                }, 600);
            } else {
                zhCard.classList.add('incorrect');
                enCard.classList.add('incorrect');

                setTimeout(() => {
                    zhCard.classList.remove('incorrect');
                    enCard.classList.remove('incorrect');
                }, 400);
            }
        }

        initGame();
    </script>
</body>
</html>
