<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>中英單詞配對遊戲</title>
    <style>
        :root {
            --success: #00e676;
            --error: #ff1744;
            --text-shadow: rgba(0, 0, 0, 0.4);
        }

        * {
            box-sizing: border-box;
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            margin: 0;
            padding: 15px;
            /* 活潑的圓點背景 */
            background-color: #f4f7f6;
            background-image: radial-gradient(#d1d8e0 2px, transparent 2px);
            background-size: 20px 20px;
            color: #333;
            text-align: center;
        }

        .header {
            margin-bottom: 20px;
            position: sticky;
            top: 0;
            background: rgba(255, 255, 255, 0.9);
            padding: 15px 0;
            z-index: 100;
            border-radius: 0 0 15px 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            backdrop-filter: blur(5px);
        }

        h1 {
            margin: 0 0 10px 0;
            font-size: 1.6rem;
            color: #2c3e50;
            font-weight: 900;
        }

        .progress {
            font-size: 1.2rem;
            font-weight: 800;
            color: #636e72;
        }
        
        #score {
            color: #ff4757;
            font-size: 1.4rem;
        }

        .zone-title {
            font-size: 1.2rem;
            font-weight: 900;
            margin: 20px 0 10px 0;
            color: #2d3436;
            text-align: left;
            padding-left: 5px;
            text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
        }

        /* 網格佈局 */
        .grid-zone {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 25px;
        }

        @media (min-width: 768px) {
            .grid-zone {
                grid-template-columns: repeat(5, 1fr);
                gap: 15px;
            }
        }

        /* 卡片基礎樣式 - 3D果凍感 */
        .card {
            border-radius: 12px;
            padding: 10px 5px;
            font-weight: 900;
            cursor: pointer;
            user-select: none;
            transition: transform 0.1s ease, box-shadow 0.1s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 70px;
            word-break: break-word;
            color: #ffffff;
            text-shadow: 1px 1.5px 2px var(--text-shadow);
            /* 3D 陰影效果 */
            box-shadow: 0 5px 0 rgba(0,0,0,0.15);
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        /* 懸停與點擊的物理回饋 */
        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 7px 0 rgba(0,0,0,0.15);
        }
        .card:active {
            transform: translateY(4px);
            box-shadow: 0 1px 0 rgba(0,0,0,0.15);
        }

        /* 點擊選取狀態：加上發光白框，不覆蓋原本的漸層 */
        .card.selected {
            outline: 4px solid #ffffff;
            outline-offset: -2px;
            box-shadow: 0 0 15px 5px rgba(255, 255, 255, 0.9), 0 5px 0 rgba(0,0,0,0.15) !important;
            transform: scale(1.05) translateY(-2px);
            z-index: 10;
        }

        /* 配對成功：耀眼綠光 */
        @keyframes glowGreen {
            0% { filter: hue-rotate(0deg); outline: 4px solid var(--success); box-shadow: 0 0 10px var(--success); }
            100% { background: var(--success) !important; outline: 4px solid #fff; box-shadow: 0 0 30px var(--success); }
        }

        .card.correct {
            animation: glowGreen 0.6s ease-in-out forwards !important;
            pointer-events: none;
        }

        /* 配對成功後淡出，保留佔位空間 */
        .card.matched {
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        /* 配對失敗：紅光與震動 */
        @keyframes shakeRed {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-6px) rotate(-2deg); outline: 4px solid var(--error); }
            75% { transform: translateX(6px) rotate(2deg); outline: 4px solid var(--error); background: var(--error) !important;}
        }

        .card.incorrect {
            animation: shakeRed 0.4s ease-in-out !important;
            pointer-events: none;
            z-index: 10;
        }

        /* 字體大小區隔 */
        .zh-card {
            font-size: 1.8rem;
            cursor: grab;
        }
        .zh-card:active {
            cursor: grabbing;
        }
        .en-card {
            font-size: 1.1rem;
            line-height: 1.2;
        }

    </style>
</head>
<body>

    <div class="header">
        <h1>✨ 中英單詞配對 ✨</h1>
        <div class="progress">進度: <span id="score">0</span> / 15</div>
    </div>

    <div class="zone-title">👇 中文字卡區
